name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build universal app bundle
        run: ./Scripts/build-app.sh release

      - name: Verify app bundle
        run: ./Scripts/verify-app.sh

      - name: Check Homebrew Cask invariants
        run: ruby test/cask_test.rb

      - name: Set up Homebrew tap
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Homebrew tap syntax
        run: brew test-bot --only-tap-syntax
