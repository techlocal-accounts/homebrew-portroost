name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build universal app bundle
        run: ./Scripts/build-app.sh release

      - name: Verify app bundle
        run: ./Scripts/verify-app.sh
