name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run unit tests
        run: swift test

      - name: Build release archive
        run: ./Scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/PortRoost-*-macOS.zip
          dist/PortRoost-*-macOS.zip.sha256
          --generate-notes
          --title "PortRoost ${GITHUB_REF_NAME#v}"
